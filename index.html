<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambaşlar İnşaat | Villa Ve Malikane Projeleri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #b8860b; /* İstediğin Özel Altın Rengi */
            --black: #1a1a1a; 
            --gray: #f4f4f4; 
            --text: #333; 
            --whatsapp: #25d366; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Poppins', sans-serif; line-height: 1.6; color: var(--text); background: #fff; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; background: var(--black); position: sticky; top: 0; z-index: 1000; }
        .logo { color: #fff; font-family: 'Montserrat'; font-size: 1.2rem; display: flex; align-items: center; }
        .logo img { height: 50px; margin-right: 15px; }
        .nav-links { display: flex; list-style: none; }
        .nav-links li { margin-left: 25px; }
        .nav-links a { color: #fff; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover { color: var(--gold); }

        .hero { 
            height: 70vh; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('proje2.jpg'); 
            background-size: cover; 
            background-position: center; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            color: #fff; 
        }
        .hero h1 { font-family: 'Montserrat'; font-size: 3rem; text-transform: uppercase; }
        .btn-gold { padding: 12px 30px; background: var(--gold); color: #fff; text-decoration: none; border-radius: 5px; font-weight: 600; display: inline-block; margin-top: 20px; transition: 0.3s; }

        section { padding: 80px 8%; }
        h2.section-title { text-align: center; font-size: 2.2rem; margin-bottom: 50px; font-family: 'Montserrat'; }
        h2.section-title::after { content: ''; display: block; width: 60px; height: 3px; background: var(--gold); margin: 10px auto; }
        
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 230px; object-fit: cover; }
        .card-body { padding: 20px; }

        /* YÜZEN BUTONLAR */
        .floating-container { position: fixed; bottom: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        .left-btns { left: 30px; }
        .right-btns { right: 30px; }

        .btn-float {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: white; box-shadow: 2px 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s; text-decoration: none;
        }
        .btn-float:hover { transform: scale(1.1); filter: brightness(1.2); }
        .whatsapp-btn { background-color: var(--whatsapp); }
        .phone-btn { background-color: var(--gold); }
        .map-btn { background-color: var(--gold); }

        footer { background: var(--black); color: #888; text-align: center; padding: 40px; }
    </style>
</head>
<body>

    <div class="floating-container left-btns">
        <a href="https://www.google.com/maps/search/?api=1&query=Tambaşlar+Emlak+Güngören" class="btn-float map-btn" target="_blank">
            <i class="fas fa-map-marker-alt"></i>
        </a>
        <a href="tel:905322560936" class="btn-float phone-btn">
            <i class="fas fa-phone-alt"></i>
        </a>
    </div>

    <div class="floating-container right-btns">
        <a href="https://wa.me/905322560936" class="btn-float whatsapp-btn" target="_blank">
            <i class="fab fa-whatsapp"></i>
        </a>
    </div>

    <nav>
        <div class="logo"><span>TAMBAŞLAR İNŞAAT</span></div>
        <ul class="nav-links">
            <li><a href="#anasayfa">Ana Sayfa</a></li>
            <li><a href="#projeler">Projeler</a></li>
            <li><a href="#iletisim">İletişim</a></li>
        </ul>
    </nav>

    <header id="anasayfa" class="hero">
        <div>
            <h1>TAMBAŞLAR İNŞAAT</h1>
            <p>Estetik ve Güvenli Yaşam Alanları</p>
            <a href="#projeler" class="btn-gold">Projeleri İncele</a>
        </div>
    </header>

    <section id="iletisim">
        <h2 class="section-title">Bize Ulaşın</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 50px;">
            <div>
                <p><i class="fas fa-map-marker-alt" style="color:var(--gold);"></i> Güven Mah. Posta Cad. No:98, Güngören/İstanbul</p>
                <p><i class="fas fa-phone" style="color:var(--gold);"></i> 0532 256 09 36</p>
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3010.518!2d28.8724!3d41.0146!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14caaec6ddf97697%3A0x4d05021a176b5b3f!2zVGFtYmHFn2xhciBFbWxhaw!5e0!3m2!1str!2str!4v1700000000000!5m2!1str!2str" 
                    width="100%" height="300" style="border:0; border-radius:10px; margin-top:20px;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
            <form action="https://formspree.io/f/xjgkpraa" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" name="ad" placeholder="Adınız" required style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
                <textarea name="mesaj" rows="4" placeholder="Mesajınız" required style="padding: 12px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                <button type="submit" style="background: var(--gold); color: #fff; padding: 15px; border: none; border-radius: 5px; cursor: pointer;">GÖNDER</button>
            </form>
        </div>
    </section>

    <footer><p>© 2026 Tambaşlar İnşaat. Tüm Hakları Saklıdır.</p></footer>
</body>
</html>
